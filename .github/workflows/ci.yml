name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it, and a compromised
# third-party action cannot push to the repository or mint a package.
permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs. A tag is a moving pointer the
      # action's author can repoint at any time, and this workflow runs against every
      # pull request. The comment records which tag the SHA was, so upgrading is a
      # legible diff rather than an archaeological exercise.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # No terraform, checkov, or opa on this runner. The unit suite must pass without
      # them: invariant 4 says a missing binary is a skip, not a failure, and the only
      # way to keep that true is to run somewhere none of them exist.
      - run: uv run pytest -m "not slow"
