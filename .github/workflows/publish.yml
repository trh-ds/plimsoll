name: Publish

# Tag-triggered release to PyPI via trusted publishing.
#
# No API token exists anywhere in this repository, and none should be added. Trusted
# publishing has PyPI mint a short-lived credential for this specific workflow in this
# specific repository, so there is no long-lived secret to leak, rotate, or forget to
# rotate. Setting it up is one form on PyPI: owner, repository, workflow filename
# (`publish.yml`), and environment (`pypi`).
#
# The gate before publishing is not a formality. A release is the one artifact that
# cannot be taken back -- PyPI does not allow re-uploading a version -- so the full suite
# and the Rego tests run first, and the version in the tag has to match the version in
# `pyproject.toml`. Publishing 0.1.0 from a tree that says 0.1.0.dev0 is the kind of
# mistake that is only discoverable afterwards.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - run: uv sync

      - name: The tag and the packaged version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${packaged}"
            exit 1
          fi

      - name: The suite, before anything irreversible
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run mypy src/
          uv run pytest -m "not slow"

      - run: uv build

      - name: The wheel carries the rule pack, and not its tests
        # The pack is bundled -- a rule pack that does not ship in the wheel is not
        # bundled -- and the `*_test.rego` files beside it are excluded, because
        # `opa eval` would load them on every scan of every install.
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl > contents.txt
          grep -q "plimsoll/policies/s3.rego" contents.txt \
            || { echo "::error::the rule pack is missing from the wheel"; exit 1; }
          if grep -q "_test.rego" contents.txt; then
            echo "::error::rego unit tests were packaged into the wheel"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A named environment so the publish can be gated on a manual approval in the
    # repository settings if that is ever wanted, without touching this file.
    environment: pypi
    permissions:
      # The only permission trusted publishing needs, and the reason no token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
