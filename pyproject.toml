[project]
name = "plimsoll"
version = "0.1.0.dev0"
description = "A verification agent for AI-generated infrastructure code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
plimsoll = "plimsoll.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plimsoll"]
# The Rego unit tests live beside the rules they test, which is what `opa test` expects.
# They do not belong in a user's install: `opa eval --data <pack>` would load them on
# every scan, and a shipped test package is a thing someone will eventually mistake for a
# rule. `data.plimsoll.findings` is unaffected either way -- this is hygiene, not a fix.
exclude = ["src/plimsoll/policies/*_test.rego"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# mypy only runs on src/; annotations in tests buy nothing and read as noise.
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: shells out to a real external binary; excluded from the unit run",
]
